<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>SocGen DriftShield: Enterprise Threat Verification & SOAR Platform</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🛡️</text></svg>" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@stlite/browser@1.11.0/build/stlite.css" />
    <style>
      body, html {
        margin: 0;
        padding: 0;
        height: 100%;
        width: 100%;
        background-color: #0e1117;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }
      #stlite-loading-banner {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: #0b0f19;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        color: #f1f5f9;
        z-index: 99999;
        transition: opacity 0.5s ease-out;
      }
      .spinner {
        width: 48px;
        height: 48px;
        border: 4px solid rgba(244, 63, 94, 0.2);
        border-top-color: #f43f5e;
        border-radius: 50%;
        animation: spin 1s linear infinite;
        margin-bottom: 20px;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <div id="stlite-loading-banner">
      <div class="spinner"></div>
      <h2 style="margin: 0 0 8px 0; font-weight: 600; letter-spacing: -0.5px;">🛡️ SocGen DriftShield</h2>
      <p style="margin: 0; color: #94a3b8; font-size: 14px;">Initializing Pyodide WebAssembly telemetry engine...</p>
    </div>

    <streamlit-app src="./app.py">
      <app-file name="attack_graph.py" url="./attack_graph.py"></app-file>
      <app-file name="compliance.py" url="./compliance.py"></app-file>
      <app-file name="copilot.py" url="./copilot.py"></app-file>
      <app-file name="remediation.py" url="./remediation.py"></app-file>
      <app-file name="engine.py" url="./engine.py"></app-file>
      <app-file name=".streamlit/config.toml" url="./.streamlit/config.toml"></app-file>
      <app-file name="baseline_controls.json" url="./baseline_controls.json"></app-file>
      <app-file name="control_metadata.csv" url="./control_metadata.csv"></app-file>
      <app-file name="drift_event_labels.csv" url="./drift_event_labels.csv"></app-file>
      <app-file name="eval_labels.csv" url="./eval_labels.csv"></app-file>
      <app-file name="maintenance_windows.csv" url="./maintenance_windows.csv"></app-file>
      <app-requirements>
        pandas
        scikit-learn
        plotly
        networkx
      </app-requirements>
    </streamlit-app>

    <script type="module">
      import { mount } from "https://cdn.jsdelivr.net/npm/@stlite/browser@1.11.0/build/stlite.js";
      
      // Observe when streamlit finishes mounting to dismiss the custom loading banner
      const observer = new MutationObserver(() => {
        const root = document.querySelector('.stApp');
        if (root) {
          const banner = document.getElementById('stlite-loading-banner');
          if (banner) {
            banner.style.opacity = '0';
            setTimeout(() => banner.remove(), 500);
          }
          observer.disconnect();
        }
      });
      observer.observe(document.body, { childList: true, subtree: true });
    </script>
  </body>
</html>
